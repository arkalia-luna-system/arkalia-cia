# Flutter CI pour Arkalia CIA
# Tests et build de l'application Flutter

name: "Flutter CI"

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "arkalia_cia/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "arkalia_cia/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-test:
    name: "Flutter Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0" # Nécessaire pour Dart 3.7.0+ (google_sign_in 7.2.0)
          channel: "stable"
          cache: true

      - name: "Install Flutter Dependencies"
        run: |
          cd arkalia_cia
          # Vérifier que pubspec.lock contient fl_chart 1.0.0
          if ! awk '/fl_chart:/{flag=1;next}/^[^ ]/{flag=0}flag && /version: "1.0.0"/{found=1} END{exit !found}' pubspec.lock; then
            echo "⚠️ Attention: pubspec.lock ne contient pas fl_chart 1.0.0"
          fi
          flutter pub get
          # Vérifier la version installée
          flutter pub deps | grep "fl_chart" || echo "fl_chart non trouvé dans les dépendances"

      - name: "Flutter Analyze"
        run: |
          cd arkalia_cia
          flutter analyze --no-fatal-infos

      - name: "Flutter Test with Coverage"
        run: |
          set -euo pipefail
          cd arkalia_cia
          echo "🧪 Running Flutter tests with coverage..."
          flutter test --coverage

          # Tests PWA si disponibles
          if [ -f "../tests/web/pwa_test.dart" ]; then
            echo "🧪 Running PWA tests..."
            cd ..
            dart test tests/web/pwa_test.dart
            cd arkalia_cia
          fi

          # Vérifier que le fichier de couverture a été généré
          if [ -f "coverage/lcov.info" ]; then
            echo "✅ Coverage report generated: coverage/lcov.info"
            echo "Lines in coverage file: $(wc -l < coverage/lcov.info)"
          else
            echo "⚠️ Coverage file not found, but continuing..."
          fi

      - name: "Flutter Build Web"
        run: |
          set -euo pipefail
          cd arkalia_cia
          echo "📦 Building Flutter web..."
          flutter clean
          flutter pub get
          flutter build web --release
          test -f build/web/index.html

      - name: "Phase 1: Configuration flutter.source"
        run: |
          cd arkalia_cia
          chmod +x scripts/ci-phase1-configure-flutter-source.sh
          ./scripts/ci-phase1-configure-flutter-source.sh

      - name: "Phase 2: Nettoyage fichiers macOS"
        run: |
          cd arkalia_cia
          chmod +x scripts/ci-phase2-clean-macos-files.sh
          ./scripts/ci-phase2-clean-macos-files.sh

      - name: "Phase 3: Build APK"
        run: |
          cd arkalia_cia
          chmod +x scripts/ci-phase3-build-apk.sh
          # S'assurer que gradlew a les permissions d'exécution (pour le fallback)
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          ./scripts/ci-phase3-build-apk.sh

      - name: "Upload Coverage to Codecov"
        if: hashFiles('arkalia_cia/coverage/lcov.info') != ''
        uses: codecov/codecov-action@v5
        with:
          files: arkalia_cia/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: true
          verbose: true
          directory: arkalia_cia
        env:
          CODECOV_TOKEN: ${{ vars.CODECOV_TOKEN || secrets.CODECOV_TOKEN || '' }}

      - name: "Upload Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: flutter-builds
          path: |
            arkalia_cia/build/web/
            arkalia_cia/build/app/outputs/flutter-apk/
          retention-days: 7

      - name: "Upload Coverage Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: arkalia_cia/coverage/lcov.info
          retention-days: 30
        if: hashFiles('arkalia_cia/coverage/lcov.info') != ''

  flutter-lint:
    name: "Flutter Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0" # Nécessaire pour Dart 3.7.0+ (google_sign_in 7.2.0)
          channel: "stable"

      - name: "Install Flutter Dependencies"
        run: |
          cd arkalia_cia
          # Vérifier que pubspec.lock contient fl_chart 1.0.0
          if ! awk '/fl_chart:/{flag=1;next}/^[^ ]/{flag=0}flag && /version: "1.0.0"/{found=1} END{exit !found}' pubspec.lock; then
            echo "⚠️ Attention: pubspec.lock ne contient pas fl_chart 1.0.0"
          fi
          flutter pub get
          # Vérifier la version installée
          flutter pub deps | grep "fl_chart" || echo "fl_chart non trouvé dans les dépendances"

      - name: "Flutter Lint"
        run: |
          cd arkalia_cia
          flutter analyze --no-fatal-infos

      - name: "Dart Format Check"
        run: |
          cd arkalia_cia
          dart format --output=none --set-exit-if-changed .

  # ========================================
  # DÉPLOIEMENT AUTOMATIQUE GITHUB PAGES
  # ========================================
  deploy-pages:
    name: "Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: flutter-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0" # Nécessaire pour Dart 3.7.0+ (google_sign_in 7.2.0)
          channel: "stable"
          cache: true

      - name: "Install Flutter Dependencies"
        run: |
          cd arkalia_cia
          # Vérifier que pubspec.lock contient fl_chart 1.0.0
          if ! awk '/fl_chart:/{flag=1;next}/^[^ ]/{flag=0}flag && /version: "1.0.0"/{found=1} END{exit !found}' pubspec.lock; then
            echo "⚠️ Attention: pubspec.lock ne contient pas fl_chart 1.0.0"
          fi
          flutter pub get
          # Vérifier la version installée
          flutter pub deps | grep "fl_chart" || echo "fl_chart non trouvé dans les dépendances"

      - name: "Build Web for GitHub Pages"
        run: |
          cd arkalia_cia
          echo "📦 Building Flutter web for GitHub Pages..."
          flutter clean
          flutter pub get
          # Base-href nécessaire pour GitHub Pages (repo non-racine)
          flutter build web --release --base-href "/arkalia-cia/"

      - name: "Setup Pages"
        uses: actions/configure-pages@v5

      - name: "Upload artifact"
        uses: actions/upload-pages-artifact@v4
        with:
          path: arkalia_cia/build/web

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
