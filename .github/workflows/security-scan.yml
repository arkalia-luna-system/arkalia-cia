# Security Scan pour Arkalia CIA
# Scan de sécurité automatisé et complet

name: "Security Scan"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # Scan quotidien à 3h00 UTC (5h00 Paris)
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "Install Security Tools"
        run: |
          pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -r requirements.txt

      - name: "Bandit Security Scan"
        run: |
          set -euo pipefail
          echo "🔍 Bandit Security Scan"
          bandit -r arkalia_cia_python_backend/ \
            -f json -o bandit-report.json \
            -f txt -o bandit-report.txt \
            --severity-level medium \
            --confidence-level medium

      - name: "Safety Check"
        run: |
          set -euo pipefail
          echo "🔍 Safety Check"
          safety scan -r requirements.txt \
            --json --output safety-report.json
          safety scan -r requirements.txt \
            --output safety-report.txt

      - name: "Pip Audit"
        run: |
          set -euo pipefail
          echo "🔍 Pip Audit"
          pip-audit -r requirements.txt \
            --format=json --output=pip-audit.json

      - name: "Semgrep Security Scan"
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/python
            p/owasp-top-ten
        id: semgrep

      - name: "Setup Flutter"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: "stable"

      - name: "Convert Semgrep SARIF to JSON"
        if: always()
        run: |
          echo "🔍 Converting Semgrep SARIF to JSON"
          if [ -f .semgrep/semgrep.sarif ]; then
            # Convert SARIF to JSON format (simplified)
            jq '.' .semgrep/semgrep.sarif > semgrep-report.json || \
            echo '{"results": []}' > semgrep-report.json
          else
            echo '{"results": []}' > semgrep-report.json
          fi

      - name: "Flutter Security Check"
        run: |
          set -euo pipefail
          echo "🔍 Flutter Security Check"
          # Setup Flutter
          echo "Flutter disponible via workflow Flutter dédié; analyse dépendances via pub."
          cd arkalia_cia
          flutter pub deps --json > ../flutter-deps.json
          flutter analyze --no-fatal-infos > ../flutter-analyze.txt

      - name: "Upload Security Reports"
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_number }}
          path: |
            *-report.json
            flutter-deps.json
            flutter-analyze.txt
          retention-days: 90

      - name: "Security Summary"
        run: |
          echo "🛡️ SECURITY SCAN SUMMARY"
          echo "========================="

          # Bandit summary
          if [ -f bandit-report.json ]; then
            echo "Bandit: $(jq '.results | length' bandit-report.json) issues found"
          else
            echo "Bandit: No report generated"
          fi

          # Safety summary
          if [ -f safety-report.json ]; then
            echo "Safety: $(jq '.vulnerabilities | length' safety-report.json) vulnerabilities found"
          else
            echo "Safety: No report generated"
          fi

          # Pip audit summary
          if [ -f pip-audit.json ]; then
            echo "Pip Audit: $(jq '.vulnerabilities | length' pip-audit.json) vulnerabilities found"
          else
            echo "Pip Audit: No report generated"
          fi

          # Semgrep summary
          if [ -f semgrep-report.json ]; then
            echo "Semgrep: $(jq '.results | length' semgrep-report.json) findings"
          else
            echo "Semgrep: No report generated"
          fi

          echo "========================="
          echo "Reports uploaded as artifacts"

