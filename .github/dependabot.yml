# Configuration Dependabot pour Arkalia CIA
# Détection automatique des vulnérabilités de dépendances

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "python"

  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/arkalia_cia"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "flutter"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"
      - "github-actions"
