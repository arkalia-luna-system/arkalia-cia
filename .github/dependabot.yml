# Configuration Dependabot pour Arkalia CIA
# Détection automatique des vulnérabilités de dépendances

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "python"
    # PRs automatiques désactivées : montées de version manuelles (tests / stack ML / compat CI).
    ignore:
      - dependency-name: "prophet"
      - dependency-name: "httpx"
      - dependency-name: "pandas"
      - dependency-name: "pydantic"
      - dependency-name: "click"
      # FastAPI 0.136.x exige starlette <0.50 ; 1.x casserait le backend
      - dependency-name: "starlette"
        update-types: ["version-update:semver-major"]

  # Flutter/Dart dependencies
  - package-ecosystem: "pub"
    directory: "/arkalia_cia"
    schedule:
      interval: "daily"
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "flutter"
    ignore:
      - dependency-name: "fl_chart"
      - dependency-name: "flutter_contacts"
      # Bloquer seulement le passage à file_picker 11.x (breaking)
      - dependency-name: "file_picker"
        update-types: ["version-update:semver-major"]
      # 1.0.9+ requiert Dart ^3.9 ; CI Flutter 3.29 = Dart 3.7
      - dependency-name: "cupertino_icons"
      # 13.x requiert Dart ≥3.10 ; CI = Dart 3.7
      - dependency-name: "device_info_plus"
        update-types: ["version-update:semver-major"]
      - dependency-name: "share_plus"
        update-types: ["version-update:semver-major"]
      - dependency-name: "permission_handler"
        update-types: ["version-update:semver-major"]
      # 2.1.6 / 2.4.3 exigent Dart ≥3.10 ; CI Flutter 3.29 = Dart 3.7
      - dependency-name: "path_provider"
      - dependency-name: "sqflite"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    assignees:
      - "arkalia-luna-system"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"
      - "github-actions"
